# Boundary/function overrides auto-healed by rexauto.
# `end` = extend a function the recompiler split mid-flow;
# `parent` = a chunk (address-taken sub-entry) of a parent function;
# `{}`  = a function discovered at runtime by the heal loop.
#
# fifadllzf's virtual-function thunks ('addi r3,r3,-4; b <impl>') are compiled
# only sporadically by static discovery -- the title calls the skipped ones
# through their vtable slots and hits the runtime's invalid-function trap.
# Every entry below is such a thunk (or an earlier runtime cure); each one's
# branch target is already compiled, so registering the entry is sufficient.

